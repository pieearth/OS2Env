# OS2Env configuration file
#
# OS2Env execution mode
#
# By default, both 16-bit and 32-bit VIO programs are supported.
# Specify 16 to allow only 16-bit VIO programs.
# Specify 32 to allow only 32-bit VIO programs.
#
# 16
# 32

# OS/2 drive and directory mappings
#
# Map an OS/2 drive root or directory to a Plan 9 directory.
# Additional drives and directory mappings are allowed.
# More-specific mappings override their parent mapping.
#
# If no drive label is specified, the drive has no volume label.
# If size is omitted, available space follows the backing filesystem.

label C: MAIN

C:\         $home/os2hdd32
C:\Files    $home/files

# Optional reported drive capacity.
# Does not enforce a storage quota.
# size C: 4G

# working directory specifies the initial directory.
# if not included in the previous section, it will be ignored 
# and the drive specified's root will be selected used.
# wd      $home/files

wd          $home/files

# Private INI file location
#
# Default Plan 9 directory for private application INI files.
# Explicit paths supplied by applications are not redirected.

inidir      $home/files/Settings

# Future settings
# mmx off - disables MMX extensions
# fpu off - disables FPU coprocessor
# windowed - launches OS2Env in windowed mode
# family - restricts applications to Family API compatibility

# VIO colour palette
#
# OS2Env supports the original 16 VIO colour indices (0-15).
# The entries below replace their original VGA RGB values.
#
# All 16 colours are enabled by default.
# Remove or comment out these entries to restore the
# original VGA palette.
#
# Colour indices and application attributes are unchanged.
# Format: color <index> <#RRGGBB>

color 0  #24272C
color 1  #426A9A
color 2  #397C62
color 3  #347F87
color 4  #A94F53
color 5  #92628E
color 6  #987344
color 7  #C5C4BF
color 8  #62666D
color 9  #81A9D0
color 10 #8DBD9A
color 11 #83C4C9
color 12 #D98A87
color 13 #C39ABE
color 14 #D8BC78
color 15 #ECE9E1

# These keyboard shorcuts are hardcoded.
# F11       fullscreen
# F12       OS2Env overlay
# Ctrl+0    reset zoom
# Ctrl+-    zoom out
# Ctrl+=    zoom in